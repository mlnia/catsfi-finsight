# Full local stack: API + Qdrant + Jaeger (traces) + Prometheus (metrics) + Grafana (dashboard)
#   docker compose up --build
#   UI http://localhost:8000 · API docs /docs · Grafana http://localhost:3000 · Jaeger http://localhost:16686
services:
  api:
    build: .
    image: catsfi-finsight:latest
    env_file: [{ path: .env, required: false }]
    environment:
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      SEED_TICKERS: ${SEED_TICKERS:-AAPL,MSFT,NVDA}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-CATsFi FinSight research contact@example.com}
    ports: ["8000:8000"]
    volumes: [finsight-data:/app/data]
    depends_on:
      qdrant: { condition: service_started }
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  finsight-data:
  qdrant-data:
