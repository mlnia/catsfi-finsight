name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + integration tests
        run: pytest --cov=finsight --cov-report=term --cov-fail-under=80
      - name: Evaluation quality gate (offline, deterministic)
        run: python -m finsight.eval.runner --dataset fixture --modes hybrid,dense,sparse --prompts rag_answer@v1,rag_answer@v2 --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: reports/ }

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: catsfi-finsight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name fs -p 8000:8000 -e ENV=dev -e EMBEDDING_PROVIDER=hash -e RERANKER=none catsfi-finsight:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs localhost:8000/readyz
          docker logs fs | tail -n 20
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag catsfi-finsight:ci "$IMAGE" && docker push "$IMAGE"
          docker tag catsfi-finsight:ci "ghcr.io/${{ github.repository }}:latest" && docker push "ghcr.io/${{ github.repository }}:latest"
